<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
// Synthetic launch spot for a fictional soda, "Daybreak Yuzu". Rendered frame by frame for the ShotFix demo.
// It contains planted problems on purpose: a can colour break (shot 3), a health claim and garbled lettering (shot 4),
// a black gap (17.5-18.1s) and a late call to action.
const W = 1920, H = 1080;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const CORAL = '#ff6f61', ORANGE = '#ff8a1f', CREAM = '#fff4e6';
const ease = (x) => (x < 0 ? 0 : x > 1 ? 1 : x * x * (3 - 2 * x));
const easeOut = (x) => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const f = (c) => Math.max(0, Math.min(255, Math.round(amt < 0 ? c * (1 + amt) : c + (255 - c) * amt)));
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}

function backdrop(stops, glow) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  stops.forEach(([o, c]) => g.addColorStop(o, c));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  if (glow) {
    const rg = ctx.createRadialGradient(glow.x, glow.y, 0, glow.x, glow.y, glow.r);
    rg.addColorStop(0, glow.c);
    rg.addColorStop(1, glow.c.replace(/[\d.]+\)$/, '0)'));
    ctx.fillStyle = rg;
    ctx.fillRect(0, 0, W, H);
  }
}

function floor(y, top, bottom) {
  const g = ctx.createLinearGradient(0, y, 0, H);
  g.addColorStop(0, top);
  g.addColorStop(1, bottom);
  ctx.fillStyle = g;
  ctx.fillRect(0, y, W, H - y);
}

function pedestal(cx, topY, w, h, base) {
  const rx = w / 2, ry = w * 0.12;
  const g = ctx.createLinearGradient(cx - rx, 0, cx + rx, 0);
  g.addColorStop(0, shade(base, -0.45));
  g.addColorStop(0.35, shade(base, 0.08));
  g.addColorStop(0.55, shade(base, 0.18));
  g.addColorStop(1, shade(base, -0.5));
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(cx - rx, topY);
  ctx.lineTo(cx - rx, topY + h);
  ctx.ellipse(cx, topY + h, rx, ry, 0, Math.PI, 0, true);
  ctx.lineTo(cx + rx, topY);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = shade(base, 0.28);
  ctx.beginPath();
  ctx.ellipse(cx, topY, rx, ry, 0, 0, Math.PI * 2);
  ctx.fill();
}

// a 330 ml can standing on baseY. face: 'front' shows the sunrise logo band, 'back' shows the nutrition panel
function can(cx, baseY, w, opts = {}) {
  const { color = CORAL, face = 'front', sweep = null, garble = false, silhouette = 0, t = 0 } = opts;
  const h = w * 1.86;
  const rx = w / 2, ry = w * 0.1;
  const top = baseY - h;
  // body
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(cx - rx, top + ry * 1.6);
  ctx.lineTo(cx - rx, baseY - ry);
  ctx.ellipse(cx, baseY - ry, rx, ry, 0, Math.PI, 0, true);
  ctx.lineTo(cx + rx, top + ry * 1.6);
  ctx.ellipse(cx, top + ry * 1.6, rx, ry, 0, 0, Math.PI, true);
  ctx.closePath();
  ctx.clip();
  const g = ctx.createLinearGradient(cx - rx, 0, cx + rx, 0);
  g.addColorStop(0, shade(color, -0.55));
  g.addColorStop(0.16, shade(color, -0.12));
  g.addColorStop(0.3, shade(color, 0.32));
  g.addColorStop(0.36, shade(color, 0.05));
  g.addColorStop(0.7, shade(color, -0.08));
  g.addColorStop(0.9, shade(color, -0.38));
  g.addColorStop(1, shade(color, -0.6));
  ctx.fillStyle = g;
  ctx.fillRect(cx - rx, top, w, h + ry);

  // label band
  const bandY = top + h * 0.34, bandH = h * 0.36;
  const lg = ctx.createLinearGradient(cx - rx, 0, cx + rx, 0);
  lg.addColorStop(0, 'rgba(120,90,70,0.9)');
  lg.addColorStop(0.18, shade(CREAM, -0.05));
  lg.addColorStop(0.32, '#ffffff');
  lg.addColorStop(0.75, shade(CREAM, -0.08));
  lg.addColorStop(1, 'rgba(110,80,60,0.95)');
  ctx.fillStyle = lg;
  ctx.fillRect(cx - rx, bandY, w, bandH);

  if (face === 'front') {
    // sunrise logo
    const sx = cx - w * 0.04, sy = bandY + bandH * 0.46, sr = w * 0.17;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(sx, sy, sr, Math.PI, 0);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = color;
    ctx.lineWidth = w * 0.022;
    ctx.lineCap = 'round';
    for (let i = 0; i < 7; i++) {
      const a = Math.PI + (i / 6) * Math.PI;
      ctx.beginPath();
      ctx.moveTo(sx + Math.cos(a) * sr * 1.28, sy + Math.sin(a) * sr * 1.28);
      ctx.lineTo(sx + Math.cos(a) * sr * 1.6, sy + Math.sin(a) * sr * 1.6);
      ctx.stroke();
    }
    ctx.fillStyle = '#2a1a14';
    ctx.font = `700 ${Math.round(w * 0.16)}px Bahnschrift, 'Segoe UI', sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText(garble ? 'DAYBR3AK' : 'DAYBREAK', cx - w * 0.04, bandY + bandH * 0.78);
    ctx.font = `600 ${Math.round(w * 0.075)}px Bahnschrift, 'Segoe UI', sans-serif`;
    ctx.fillStyle = shade(color, -0.25);
    ctx.fillText(garble ? 'SPARKLNIG  YUZ U' : 'SPARKLING  YUZU', cx - w * 0.04, bandY + bandH * 0.93);
  } else {
    // back of the can: nutrition panel, barcode
    ctx.fillStyle = 'rgba(40,26,20,0.75)';
    for (let i = 0; i < 6; i++) ctx.fillRect(cx - w * 0.3, bandY + bandH * (0.16 + i * 0.1), w * (0.42 + rnd(i) * 0.12), w * 0.018);
    for (let i = 0; i < 18; i++) ctx.fillRect(cx + w * 0.16 + i * w * 0.008, bandY + bandH * 0.18, w * (rnd(i + 9) > 0.5 ? 0.004 : 0.0022), bandH * 0.4);
  }

  // condensation
  for (let i = 0; i < 70; i++) {
    const px = cx - rx + rnd(i) * w, py = top + ry * 2 + rnd(i + 50) * (h - ry * 3);
    const r = w * (0.006 + rnd(i + 99) * 0.012);
    ctx.fillStyle = 'rgba(255,255,255,0.32)';
    ctx.beginPath();
    ctx.ellipse(px, py, r, r * 1.3, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    ctx.beginPath();
    ctx.ellipse(px + r * 0.3, py + r * 0.5, r * 0.7, r * 0.8, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  // moving light sweep
  if (sweep != null) {
    const x = cx - rx * 2 + sweep * w * 3;
    const sg = ctx.createLinearGradient(x - w * 0.3, 0, x + w * 0.3, 0);
    sg.addColorStop(0, 'rgba(255,255,255,0)');
    sg.addColorStop(0.5, 'rgba(255,255,255,0.55)');
    sg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = sg;
    ctx.fillRect(cx - rx, top, w, h + ry);
  }
  if (silhouette > 0) {
    ctx.fillStyle = `rgba(4,6,20,${silhouette})`;
    ctx.fillRect(cx - rx, top, w, h + ry);
    // rim light on the right edge
    const rim = ctx.createLinearGradient(cx + rx - w * 0.08, 0, cx + rx, 0);
    rim.addColorStop(0, 'rgba(120,150,255,0)');
    rim.addColorStop(1, `rgba(150,175,255,${0.85 * silhouette})`);
    ctx.fillStyle = rim;
    ctx.fillRect(cx - rx, top, w, h + ry);
  }
  ctx.restore();

  // lid
  const lid = ctx.createLinearGradient(cx - rx, 0, cx + rx, 0);
  lid.addColorStop(0, '#5d6470');
  lid.addColorStop(0.3, '#e9edf3');
  lid.addColorStop(0.55, '#a9b0bb');
  lid.addColorStop(1, '#4b515b');
  ctx.fillStyle = silhouette > 0 ? `rgba(20,24,40,1)` : lid;
  ctx.beginPath();
  ctx.ellipse(cx, top + ry * 1.6, rx * 0.97, ry, 0, 0, Math.PI * 2);
  ctx.fill();
  if (!silhouette) {
    ctx.fillStyle = '#c9ced6';
    ctx.beginPath();
    ctx.ellipse(cx, top + ry * 1.45, rx * 0.8, ry * 0.72, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#8a919c';
    ctx.beginPath();
    ctx.ellipse(cx + rx * 0.18, top + ry * 1.4, rx * 0.22, ry * 0.3, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  return { x: cx - rx, y: top, w, h };
}

function bubbles(t, n, region, speed, alpha, seed = 0) {
  for (let i = 0; i < n; i++) {
    const s = rnd(i + seed);
    const r = 3 + rnd(i + seed + 400) * 16;
    const span = region.h + 200;
    const y = region.y + region.h - ((t * speed * (0.5 + s) + rnd(i + seed + 800) * span) % span) + 100;
    const x = region.x + rnd(i + seed + 200) * region.w + Math.sin(t * 2 + i) * 12;
    ctx.strokeStyle = `rgba(255,255,255,${alpha * (0.4 + s * 0.6)})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = `rgba(255,255,255,${alpha * 0.5})`;
    ctx.beginPath();
    ctx.arc(x - r * 0.35, y - r * 0.35, r * 0.25, 0, Math.PI * 2);
    ctx.fill();
  }
}

function text(str, x, y, size, opts = {}) {
  const { weight = 700, color = '#fff', align = 'left', alpha = 1, family = "Bahnschrift, 'Segoe UI', sans-serif", tracking = 0 } = opts;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  ctx.font = `${weight} ${size}px ${family}`;
  ctx.textAlign = align;
  ctx.textBaseline = 'alphabetic';
  if ('letterSpacing' in ctx) ctx.letterSpacing = `${tracking}px`;
  ctx.fillText(str, x, y);
  ctx.restore();
}

function grain(t) {
  // fine film grain so flat gradients don't band in the encode
  const id = ctx.getImageData(0, 0, W, H);
  const d = id.data;
  let s = Math.floor(t * 30) * 9973 + 17;
  for (let i = 0; i < d.length; i += 4) {
    s = (s * 1103515245 + 12345) & 0x7fffffff;
    const n = ((s >> 16) & 15) - 7.5;
    d[i] += n; d[i + 1] += n; d[i + 2] += n;
  }
  ctx.putImageData(id, 0, 0);
}

function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  if (t < 3.2) {
    // shot 1: night, a silhouette rises. slow hook, the product only reads at ~2.8s
    const k = t / 3.2;
    backdrop([[0, '#03040c'], [0.62, '#061040'], [0.7, '#0a2bd6'], [1, '#02030a']], { x: W * 0.5, y: H * 0.7, r: W * (0.35 + k * 0.15), c: `rgba(40,80,255,${0.25 + k * 0.35})` });
    floor(H * 0.7, '#050a2a', '#010207');
    const rise = easeOut(k);
    can(W * 0.5, H * 0.71 + (1 - rise) * 260, 300, { silhouette: 1 - ease((t - 2.4) / 0.8) * 0.85 });
    text("Something's rising.", W * 0.5, H * 0.24, 46, { weight: 400, align: 'center', alpha: ease((t - 0.6) / 0.8) * 0.9, tracking: 2 });
  } else if (t < 8.0) {
    // shot 2: dawn, hero product on a pedestal (the reference look: coral can, logo to camera)
    const k = (t - 3.2) / 4.8;
    const z = 1 + k * 0.06;
    ctx.translate(W / 2, H / 2);
    ctx.scale(z, z);
    ctx.translate(-W / 2, -H / 2);
    backdrop([[0, '#0b1a8f'], [0.38, '#5b3fd6'], [0.6, '#ff6aae'], [0.72, '#ffc1d6'], [1, '#ffb59a']], { x: W * 0.64, y: H * 0.66, r: W * 0.4, c: 'rgba(255,240,220,0.55)' });
    floor(H * 0.72, '#f3a6b8', '#c86d8c');
    pedestal(W * 0.64, H * 0.66, 380, 260, '#f6d7de');
    bubbles(t, 40, { x: W * 0.46, y: 0, w: W * 0.36, h: H * 0.7 }, 120, 0.5, 3);
    can(W * 0.64, H * 0.665, 250, { color: CORAL, face: 'front', sweep: ease((t - 4.4) / 1.4) });
    const a = ease((t - 3.5) / 0.6);
    text('Meet Daybreak.', W * 0.09, H * 0.46, 118, { alpha: a, tracking: -2 });
    text('Yuzu sparkling soda', W * 0.092, H * 0.46 + 70, 44, { weight: 400, alpha: ease((t - 3.9) / 0.6), tracking: 1 });
  } else if (t < 12.5) {
    // shot 3: the close-up. the can renders orange and the logo band has turned away (continuity break)
    const k = (t - 8) / 4.5;
    backdrop([[0, '#3a2bd0'], [0.5, '#ff6aae'], [1, '#ffd2c4']], { x: W * 0.4, y: H * 0.5, r: W * 0.5, c: 'rgba(255,245,235,0.45)' });
    bubbles(t, 30, { x: 0, y: 0, w: W, h: H }, 160, 0.35, 11);
    can(W * 0.4 - k * 40, H * 1.12, 560, { color: ORANGE, face: 'back' });
    bubbles(t, 14, { x: W * 0.05, y: 0, w: W * 0.6, h: H }, 260, 0.6, 29);
    text('Bright.', W * 0.66, H * 0.38, 104, { alpha: ease((t - 8.4) / 0.4) });
    text('Sharp.', W * 0.66, H * 0.38 + 112, 104, { alpha: ease((t - 9.3) / 0.4) });
    text('Ice cold.', W * 0.66, H * 0.38 + 224, 104, { alpha: ease((t - 10.2) / 0.4) });
  } else if (t < 17.5) {
    // shot 4: kinetic type. "Clinically proven focus" is an unsupported health claim; the label lettering garbles
    backdrop([[0, '#ff6aae'], [0.55, '#ffc1d6'], [1, '#fff1ea']], { x: W * 0.5, y: H * 0.3, r: W * 0.5, c: 'rgba(255,255,255,0.35)' });
    floor(H * 0.78, '#ffd6e2', '#f2b2c4');
    pedestal(W * 0.5, H * 0.74, 260, 200, '#ffffff');
    can(W * 0.5, H * 0.745, 170, { color: CORAL, face: 'front', garble: t > 14.8 });
    if (t < 14.7) {
      const a = ease((t - 12.7) / 0.35) * (1 - ease((t - 14.4) / 0.3));
      text('Zero sugar.', W * 0.5, H * 0.34, 150, { align: 'center', color: '#2a1030', alpha: a, tracking: -3 });
    } else {
      const a = ease((t - 14.8) / 0.35);
      text('Clinically proven', W * 0.5, H * 0.28, 132, { align: 'center', color: '#2a1030', alpha: a, tracking: -3 });
      text('focus.*', W * 0.5, H * 0.28 + 140, 132, { align: 'center', color: '#2a1030', alpha: ease((t - 15.1) / 0.35), tracking: -3 });
    }
  } else if (t < 18.1) {
    // black gap between shots 4 and 5
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    return;
  } else {
    // shot 5: white day end card. the call to action only lands at 22.6s
    backdrop([[0, '#fff8f3'], [0.7, '#ffe3ec'], [1, '#ffd0de']], { x: W * 0.5, y: H * 0.55, r: W * 0.4, c: 'rgba(255,255,255,0.9)' });
    floor(H * 0.76, '#ffe0ea', '#f7c5d5');
    pedestal(W * 0.5, H * 0.7, 320, 220, '#ffffff');
    can(W * 0.5, H * 0.705, 220, { color: CORAL, face: 'front', sweep: ease((t - 19) / 1.6) });
    text('Daybreak.', W * 0.5, H * 0.2, 128, { align: 'center', color: '#2a1030', alpha: ease((t - 18.4) / 0.6), tracking: -3 });
    text('Light, in a can.', W * 0.5, H * 0.2 + 70, 46, { align: 'center', weight: 400, color: '#5a2b4a', alpha: ease((t - 19.2) / 0.6) });
    if (t > 22.6) text('Shop at daybreak.example', W * 0.5, H * 0.94, 40, { align: 'center', weight: 600, color: '#2a1030', alpha: ease((t - 22.6) / 0.3) });
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  grain(t);
}
window.render = render;
</script></body></html>
